[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svr-verify"
version = "1.0.0"
description = "Standalone verifier for Signed Verification Receipts (SVR). No engine dependency required."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Invariant Research"},
]
keywords = [
    "verification",
    "receipt",
    "ed25519",
    "cryptographic",
    "audit",
    "compliance",
    "svr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pynacl>=1.5.0",
]

[project.scripts]
svr-verify = "svr_verify.cli:main"

[project.urls]
Homepage = "https://invariant.pro"
Repository = "https://github.com/Jasonleonardvolk/svr-verify"
Specification = "https://github.com/Jasonleonardvolk/sigma/blob/main/satya/spec/SVR_SPEC_v1.txt"
Schema = "https://github.com/Jasonleonardvolk/sigma/blob/main/satya/spec/svr_schema_v1.json"

[tool.setuptools.packages.find]
include = ["svr_verify*"]

[tool.setuptools.package-data]
svr_verify = ["*.html"]
